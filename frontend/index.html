<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siva Nagendra</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <h1>Siva Nagendra 3 Tier Application</h1>
        <p>Basic Three-Tier Architecture</p>

        <div class="message-container">
            <h2>Message from Database:</h2>
            <div id="message-box">Loading...</div>
        </div>

        <div class="form-container">
            <h2>Add New Message</h2>
            <form id="message-form">
                <div class="form-group">
                    <label for="message">New Message:</label>
                    <input type="text" id="message" name="message" required>
                </div>
                <button type="submit">Save Message</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {

            // Load messages on page load
            fetchMessages();

            // Function to fetch messages
            function fetchMessages() {
                fetch('http://18.61.0.66:5000/get_messages.php')
                    .then(response => response.text())
                    .then(data => {
                        document.getElementById('message-box').innerHTML = data;
                    })
                    .catch(error => {
                        console.error('Error fetching messages:', error);
                        document.getElementById('message-box').innerHTML =
                            'Failed to load messages';
                    });
            }

            // Handle form submission
            const form = document.getElementById('message-form');

            form.addEventListener('submit', function (e) {
                e.preventDefault();

                const message =
                    document.getElementById('message').value;

                // Send message to backend
                fetch('http://18.61.0.66:5000/save_message.php', {
                    method: 'POST',
                    headers: {
                           'Content-Type': 'application/json'
                         },
                           body: JSON.stringify({
                                 message: message
                        })
                      
                            
                .then(response => response.text())
                .then(data => {
                    alert(data);
                    document.getElementById('message').value = '';
                    fetchMessages(); // reload messages
                })
                .catch(error => {
                    console.error('Error saving message:', error);
                    alert('Failed to save message');
                });
            });

        });
    </script>

</body>
</html>
